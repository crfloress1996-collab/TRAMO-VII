<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: barra lateral de frentes + panel principal (indicadores → mapa lineal → cierre → restricciones). Panel de obra: azul marino CASA, ámbar de acento. */
:root{
  --bg:#EEF1F6; --panel:#FFFFFF; --panel2:#F6F8FB; --fg:#141A24; --muted:#5B6576; --line:#DCE2EA;
  --navy:#1F3864; --amber:#C55A11; --ok:#2E7D4F; --warn:#B7791F; --bad:#C0392B; --navy-soft:#E3E9F3; --amber-soft:#F6E5D9;
  --ok-soft:#E1F1E7; --warn-soft:#F8EED9; --bad-soft:#F7E0DD; --track:#E6EAF0;
  --f-disp:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F141C;--panel:#18202B;--panel2:#1D2633;--fg:#E7ECF3;--muted:#9AA6B8;--line:#2A3544;
  --navy:#8FB0E3;--amber:#E8935A;--ok:#5CC48A;--warn:#E3B55A;--bad:#EF7B6E;--navy-soft:#22324A;--amber-soft:#3A2A1F;--ok-soft:#1C3328;--warn-soft:#3A311C;--bad-soft:#3D2220;--track:#253041;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F141C;--panel:#18202B;--panel2:#1D2633;--fg:#E7ECF3;--muted:#9AA6B8;--line:#2A3544;
  --navy:#8FB0E3;--amber:#E8935A;--ok:#5CC48A;--warn:#E3B55A;--bad:#EF7B6E;--navy-soft:#22324A;--amber-soft:#3A2A1F;--ok-soft:#1C3328;--warn-soft:#3A311C;--bad-soft:#3D2220;--track:#253041;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 12px;align-self:start;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand img{height:40px;width:auto;background:#fff;border-radius:6px;padding:2px}
.brand b{font-family:var(--f-disp);font-size:20px;letter-spacing:.02em;color:var(--navy)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;color:var(--fg)}
.nav button:hover{background:var(--panel2)}
.nav button[aria-current="true"]{background:var(--navy-soft);font-weight:700}
.nav button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.nav .lbl{font-size:14px;line-height:1.2}.nav .lbl small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.nav .pc{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.navsep{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 2px}
.asidefoot{margin-top:12px;padding:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-disp);font-size:30px;margin:0;line-height:1.05;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
header.top img{height:46px;width:auto;background:#fff;border-radius:8px;padding:3px 6px}
h2{font-family:var(--f-disp);font-size:21px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .v{font-family:var(--f-disp);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;font-weight:700;margin-top:6px}.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{border-left:4px solid var(--bad);background:var(--bad-soft);padding:7px 11px;border-radius:6px;font-size:13.5px}
.frentes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fc{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.fc:hover{border-color:var(--navy)}.fc:focus-visible{outline:2px solid var(--navy)}
.fc .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fc .n{font-weight:700;font-size:15px}.fc .g{font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.crit{background:var(--amber-soft);color:var(--amber)}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--navy);border-radius:99px}
.fc .row{display:flex;justify-content:space-between;font-size:13px;gap:8px}.fc .row b{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
/* mapa lineal */
.map{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 10px;align-items:center;font-size:12.5px}
.trk{position:relative;height:18px;background:var(--track);border-radius:4px}
.trk i{position:absolute;top:0;bottom:0;border-radius:3px}
.seg-hecho{background:var(--navy)}.seg-parcial{background:repeating-linear-gradient(45deg,var(--navy) 0 4px,var(--navy-soft) 4px 8px)}
.seg-semana{background:var(--amber)}.seg-proximo{background:var(--amber-soft);outline:1px dashed var(--amber)}.seg-pendiente{background:var(--warn-soft);outline:1px solid var(--warn)}.seg-roca{background:var(--bad)}
.kmaxis{position:relative;height:30px}.kmaxis span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap;top:0}
.kmaxis span b{display:block;color:var(--fg);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
/* gantt */
.gantt{display:grid;grid-template-columns:230px minmax(0,1fr);gap:5px 10px;align-items:center;font-size:12.5px}
.gtrk{position:relative;height:20px;border-left:1px solid var(--line)}
.gtrk .gb{position:absolute;top:3px;bottom:3px;border-radius:4px}
.gb.critico{background:var(--bad)}.gb.base{background:var(--amber)}.gb.micro{background:var(--navy)}.gb.otro{background:var(--muted);opacity:.55}
.gweeks{position:relative;height:18px;font-size:11px;color:var(--muted)}.gweeks span{position:absolute;white-space:nowrap}
.today{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--amber);z-index:2}
.gl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl.c{font-weight:700;color:var(--bad)}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;max-height:640px;overflow-y:auto}
.col h3{margin:2px 4px 10px;font-size:15px;display:flex;justify-content:space-between}
.col h3 span{font-family:var(--f-disp);background:var(--track);border-radius:99px;padding:0 9px;font-size:14px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.rc .t{font-size:13.5px}.rc .m{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);align-items:center}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--navy-soft);color:var(--navy)}
.venc{color:var(--bad);font-weight:700}
select,input,textarea,button.btn{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
button.btn{cursor:pointer;background:var(--navy);color:var(--panel);border-color:var(--navy);font-weight:700;padding:7px 12px}
button.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{all:unset;cursor:pointer;font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}
.chips button[aria-pressed="true"]{background:var(--navy);color:var(--panel);border-color:var(--navy)}
.addf{display:grid;grid-template-columns:150px minmax(0,1fr) 150px 140px auto;gap:8px;margin-top:4px}
.msg{font-size:12.5px;color:var(--muted);margin-top:6px}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* frente detalle */
.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.note{background:var(--panel2);border-left:4px solid var(--amber);padding:9px 12px;border-radius:6px;font-size:14px}
.wk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:150px;margin-top:8px}
.wk .d{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:12px}
.wk .bars{display:flex;gap:4px;align-items:flex-end;height:110px}
.wk .bars i{width:16px;border-radius:3px 3px 0 0}
.wk .p{background:var(--navy-soft);outline:1px solid var(--navy)}.wk .r{background:var(--amber)}
.fuente{font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.big{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}aside{position:static}.nav{flex-direction:row;overflow-x:auto}.nav button{grid-template-columns:10px auto;white-space:nowrap}.nav .pc,.navsep,.asidefoot{display:none}
  .kb{grid-template-columns:minmax(0,1fr)}.addf{grid-template-columns:minmax(0,1fr)}.map{grid-template-columns:96px minmax(0,1fr)}.gantt{grid-template-columns:120px minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){.bar>i,.gb{transition:width .4s}}
</style>

<script>
(function(){
const FR_ORDER={bad:0,warn:1,ok:2};
let EST=null, RX=[], VIEW=(location.hash||'#general').slice(1), RFILTER='todos', db=null, user=null, canWrite=null, names={};
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const fmt=(n,d=0)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('es-PE',{maximumFractionDigits:d,minimumFractionDigits:d});
const pct=n=>n==null?'—':Math.round(n*100)+' %';
const D=s=>s?new Date(s+'T12:00:00'):null;
const fd=s=>{const d=D(s);return d?d.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—'};
const km=m=>{m=Math.round(m);return Math.floor(m/1000)+'+'+String(m%1000).padStart(3,'0')};
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate(),12)};
const days=(a,b)=>Math.round((b-a)/864e5);
const ESTL={ok:'A tiempo',warn:'En riesgo',bad:'Atrasado'};

function frentes(){return EST?[...EST.frentes].sort((a,b)=>(b.critico-a.critico)||(FR_ORDER[a.estado]-FR_ORDER[b.estado])):[]}
function openRx(fid){return RX.filter(r=>r.estado!=='Levantada'&&(!fid||r.frente===fid)).length}

function renderNav(){
  const nav=$('#nav');nav.textContent='';
  const g=el('button');g.dataset.v='general';g.append(el('span','dot'),el('span','lbl','Resumen general'),el('span'));nav.append(g);
  if(EST){nav.append(el('div','navsep','Frentes activos'));
    frentes().forEach(f=>{const b=el('button');b.dataset.v=f.id;const l=el('span','lbl',f.nombre+(f.critico?' ★':''));l.append(el('small',null,f.grupo));
      b.append(el('span','dot '+f.estado),l,el('span','pc',f.avance==null?'':pct(f.avance)));nav.append(b)})}
  nav.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-current',b.dataset.v===VIEW?'true':'false');b.onclick=()=>{location.hash=b.dataset.v}});
}
function renderKpis(){
  const k=$('#kpis');k.textContent='';if(!EST)return;
  const t=today(), c=D(EST.kpi.cierre);
  const add=(v,l,s,cls)=>{const d=el('div','kpi '+(cls||''));d.append(el('div','v',v),el('div','l',l),el('div','s',s));k.append(d)};
  add(c?String(days(t,c)):'—','días para el cierre','cierre del tramo '+fd(EST.kpi.cierre),'');
  add(fd(EST.kpi.corte_fin),'termina el corte','frente crítico · plan D','bad');
  add(fd(EST.kpi.base_fin),'termina la base emulsión','por bloques detrás del corte','warn');
  add(String(openRx()),'restricciones abiertas',RX.filter(r=>r.estado!=='Levantada'&&r.fecha&&D(r.fecha)<t).length+' vencidas',openRx()>0?'warn':'');
  add(pct(EST.kpi.ppc_ult),'PPC '+EST.kpi.ppc_sem,'actividades que cumplieron',EST.kpi.ppc_ult<0.6?'bad':'');
}
function fcCard(f){
  const b=el('button','fc');b.onclick=()=>{location.hash=f.id};
  const h=el('div','h');const l=el('div');l.append(el('div','n',f.nombre),el('div','g',f.grupo));
  const p=el('span','pill '+(f.critico?'crit':f.estado),f.critico?'Crítico':ESTL[f.estado]);h.append(l,p);b.append(h);
  const bar=el('div','bar');const i=el('i');i.style.width=((f.avance||0)*100)+'%';bar.append(i);b.append(bar);
  const r=(a,v)=>{const d=el('div','row');d.append(el('span','muted',a),el('b',null,v));b.append(d)};
  r('Avance',pct(f.avance));
  if(f.falta2!=null){r(f.falta_lbl||'Falta',fmt(f.falta,f.dec||0)+' '+f.und);r(f.falta2_lbl||'Falta',fmt(f.falta2,f.dec||0)+' '+f.und2)}else r('Falta',fmt(f.falta,f.dec||0)+' '+f.und);
  r('Ritmo',f.ritmo||'—');r(f.fin_lbl||'Termina a este ritmo',fd(f.fin)+(f.fin_sub?' · '+f.fin_sub:(f.meta_fin?' · plan '+fd(f.meta_fin):'')));
  return b;
}
function mapa(){
  const c=el('section','card');c.append(Object.assign(el('h2'),{textContent:'Mapa lineal del tramo'}));
  c.querySelector('h2').append(el('small',null,'km 217+340 → 295+347.77 · qué está terminado por capa'));
  const A=217340,B=295348,x=m=>((m-A)/(B-A)*100)+'%';
  const g=el('div','map');g.append(el('div'));const ax=el('div','kmaxis');
  [217340,230000,240000,251820,260000,267000,276810,284000,295348].forEach(m=>{const s=el('span');s.style.left=x(m);const h=(EST.hitos||[]).find(z=>z.km===m);if(h)s.append(el('b',null,h.t));s.append(document.createTextNode(km(m)));ax.append(s)});
  g.append(ax);
  EST.mapa.forEach(cp=>{g.append(el('div','gl',cp.capa));const t=el('div','trk');cp.tramos.forEach(([a,b,k])=>{const i=el('i','seg-'+k);i.style.left=x(Math.min(a,b));i.style.width=((Math.abs(b-a))/(B-A)*100)+'%';i.title=km(a)+' → '+km(b);t.append(i)});g.append(t)});
  c.append(g);const lg=el('div','legend');
  [['seg-hecho','Terminado'],['seg-parcial','Parcial / un lado'],['seg-semana','Esta semana'],['seg-proximo','Próximo'],['seg-pendiente','Corte pendiente'],['seg-roca','Roca fija (T-24)']].forEach(([k,t])=>{const s=el('span');s.append(el('i',k),document.createTextNode(t));lg.append(s)});
  c.append(lg);return c;
}
function gantt(fid){
  const rows=EST.gantt.filter(g=>!fid||g.id===fid);const c=el('section','card');
  const h=el('h2',null,'Plan de cierre');h.append(el('small',null,EST.escenario));c.append(h);
  if(!rows.length){c.append(el('div','muted','Este frente no está en el plan de cierre.'));return c}
  const A=D('2026-11-02'),B=new Date(Math.max(...EST.gantt.map(g=>D(g.fin))));B.setDate(B.getDate()+3);const T=(B-A)/864e5;
  const x=d=>(Math.max(0,days(A,d))/T*100);
  const g=el('div','gantt');g.append(el('div'));const wk=el('div','gweeks');
  for(let d=new Date(A);d<=B;d.setDate(d.getDate()+7)){const s=el('span',null,d.toLocaleDateString('es-PE',{day:'2-digit',month:'2-digit'}));s.style.left=x(new Date(d))+'%';wk.append(s)}
  g.append(wk);const td=today();
  rows.forEach(r=>{g.append(el('div','gl'+(r.tipo==='critico'?' c':''),r.frente));const t=el('div','gtrk');const b=el('i','gb '+r.tipo);
    b.style.left=x(D(r.ini))+'%';b.style.width=Math.max(.8,(days(D(r.ini),D(r.fin))+1)/T*100)+'%';b.title=r.frente+': '+fd(r.ini)+' → '+fd(r.fin);t.append(b);
    if(td>=A&&td<=B){const l=el('i','today');l.style.left=x(td)+'%';t.append(l)}g.append(t)});
  c.append(g);const lg=el('div','legend');[['critico','Ruta crítica (corte)','var(--bad)'],['base','Base e imprimación','var(--amber)'],['micro','Micropavimento','var(--navy)'],['otro','No críticos','var(--muted)']].forEach(([k,t,col])=>{const s=el('span');const i=el('i');i.style.background=col;s.append(i,document.createTextNode(t));lg.append(s)});
  const s=el('span');const i=el('i');i.style.background='var(--amber)';i.style.width='3px';s.append(i,document.createTextNode('Hoy'));lg.append(s);c.append(lg);return c;
}
function renderGeneral(){
  const v=$('#view');v.textContent='';const box=el('div');box.style.cssText='display:flex;flex-direction:column;gap:16px';
  if(EST.alertas&&EST.alertas.length){const c=el('section','card');c.append(el('h2',null,'Alertas'));const a=el('div','alerts');EST.alertas.forEach(t=>a.append(el('div','alert',t)));c.append(a);box.append(c)}
  const c=el('section','card');const h=el('h2',null,'Frentes activos');h.append(el('small',null,'toca un frente para ver su detalle'));c.append(h);
  const g=el('div','frentes');frentes().forEach(f=>g.append(fcCard(f)));c.append(g);box.append(c);
  box.append(mapa(),gantt(null));v.append(box);
}
function renderFrente(f){
  const v=$('#view');v.textContent='';const box=el('div');box.style.cssText='display:flex;flex-direction:column;gap:16px';
  const c=el('section','card');const h=el('h2',null,f.nombre);h.append(el('span','pill '+(f.critico?'crit':f.estado),f.critico?'Frente crítico':ESTL[f.estado]),el('small',null,f.grupo));c.append(h);
  const big=el('div','big');const k=(v1,l,s,cls)=>{const d=el('div','kpi '+(cls||''));d.append(el('div','v',v1),el('div','l',l),el('div','s',s||''));big.append(d)};
  k(pct(f.avance),'avance','');
  if(f.falta2!=null){k(fmt(f.falta,f.dec||0),(f.falta_lbl||'falta').toLowerCase(),f.und);k(fmt(f.falta2,f.dec||0),(f.falta2_lbl||'falta').toLowerCase(),f.und2)}else k(fmt(f.falta,f.dec||0),'falta',f.und);
  k(f.ritmo||'—','ritmo real','');k(fd(f.fin),(f.fin_lbl||'termina a este ritmo').toLowerCase(),f.fin_sub||(f.meta_fin?'plan de cierre: '+fd(f.meta_fin):''),f.meta_fin&&f.fin&&D(f.fin)>D(f.meta_fin)?'bad':'');
  c.append(big);
  if(f.donde){const d=el('div','note');d.style.marginTop='12px';d.append(el('b',null,'Dónde está: '),document.createTextNode(f.donde+(f.ult?' (reporte '+fd(f.ult)+')':'')));c.append(d)}
  if(f.nota){const d=el('div','note');d.style.marginTop='8px';d.textContent=f.nota;c.append(d)}
  if(f.semana&&f.semana.dias&&f.semana.dias.length){c.append(el('h2',null,'Esta semana: programado vs real'));const w=el('div','wk');const mx=Math.max(1,...f.semana.dias.map(d=>Math.max(d.plan||0,d.real||0)));
    f.semana.dias.forEach(d=>{const x=el('div','d');const bs=el('div','bars');const p=el('i','p');p.style.height=((d.plan||0)/mx*100)+'%';p.title='Plan '+fmt(d.plan)+' '+f.semana.und;const r=el('i','r');r.style.height=((d.real||0)/mx*100)+'%';r.title='Real '+fmt(d.real)+' '+f.semana.und;bs.append(p,r);
      x.append(el('b',null,fmt(d.real)+' / '+fmt(d.plan)),bs,el('span','muted',(d.dia||'')+' '+fd(d.fecha).slice(0,5)));w.append(x)});c.append(w);
    const lg=el('div','legend');[['var(--navy-soft)','Programado ('+f.semana.und+')'],['var(--amber)','Real']].forEach(([col,t])=>{const s=el('span');const i=el('i');i.style.background=col;s.append(i,document.createTextNode(t));lg.append(s)});c.append(lg)}
  c.append(el('div','fuente','Fuente: '+f.fuente+(f.guardado?' · guardado '+fd(f.guardado):'')));
  box.append(c,gantt(f.id));v.append(box);
}
function render(){
  renderNav();renderKpis();
  if(!EST){$('#view').innerHTML='';const e=el('div','card empty','Todavía no hay datos cargados. Se llenan con los reportes diarios de cada frente.');$('#view').append(e);renderRx();return}
  $('#sub').textContent='PE-32 · km 217+340 – 295+347.77 · '+EST.semana+' · datos al '+fd(EST.fecha_corte);
  $('#foot').textContent='Actualizado '+new Date(EST.actualizado).toLocaleString('es-PE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · '+EST.escenario;
  const f=EST.frentes.find(z=>z.id===VIEW);
  if(f){RFILTER=f.id;renderFrente(f)}else{VIEW='general';renderGeneral()}
  renderRx();
}
function renderRx(){
  const ch=$('#rchips');ch.textContent='';
  const opts=[['todos','Todos']].concat(EST?frentes().map(f=>[f.id,f.nombre]):[]);
  opts.forEach(([id,t])=>{const b=el('button',null,t+(id==='todos'?' ('+openRx()+')':' ('+openRx(id)+')'));b.setAttribute('aria-pressed',RFILTER===id?'true':'false');b.onclick=()=>{RFILTER=id;renderRx()};ch.append(b)});
  const sel=$('#af-frente');if(EST&&!sel.options.length){frentes().forEach(f=>{const o=el('option',null,f.nombre);o.value=f.id;sel.append(o)})}
  if(RFILTER!=='todos')sel.value=RFILTER;
  const kb=$('#kb');kb.textContent='';const t=today();
  ['Pendiente','En gestión','Levantada'].forEach(est=>{
    const list=RX.filter(r=>r.estado===est&&(RFILTER==='todos'||r.frente===RFILTER)).sort((a,b)=>(a.fecha||'9')<(b.fecha||'9')?-1:1);
    const col=el('div','col');const h=el('h3',null,est);h.append(el('span',null,String(list.length)));col.append(h);
    if(!list.length)col.append(el('div','muted','Nada aquí.'));
    list.forEach(r=>{const c=el('div','rc');const fr=EST&&EST.frentes.find(f=>f.id===r.frente);
      const m1=el('div','m');m1.append(el('span','tag',fr?fr.nombre:r.frente));if(r.fecha){m1.append(el('span',est!=='Levantada'&&D(r.fecha)<t?'venc':null,'Compromiso '+fd(r.fecha)))}
      c.append(m1,el('div','t',r.texto));
      const m2=el('div','m');m2.append(el('span',null,r.responsable?'Responsable: '+r.responsable:'Sin responsable'));
      if(r.actualizado_por){m2.append(el('span',null,'· movida por '+(names[r.actualizado_por]||'alguien')+' '+fd((r.actualizado_en||'').slice(0,10))))}
      if(db&&canWrite!==false){const s=el('select');s.setAttribute('aria-label','Estado');['Pendiente','En gestión','Levantada'].forEach(o=>{const op=el('option',null,o);op.value=o;if(o===est)op.selected=true;s.append(op)});
        s.onchange=async()=>{s.disabled=true;try{const uid=user?await user.id():null;await db.doc('restricciones/'+r.id).update({estado:s.value,actualizado_por:uid,actualizado_en:new Date().toISOString()})}catch(e){s.value=est;s.disabled=false;m2.append(el('span','venc','No se pudo guardar: no tienes permiso para editar este tablero.'))}};
        m2.append(s)}
      c.append(m2);col.append(c)});
    kb.append(col)});
  $('#adddet').hidden=!db||canWrite===false;
}
$('#addf').addEventListener('submit',async e=>{e.preventDefault();if(!db)return;const btn=$('#af-btn');btn.disabled=true;$('#af-msg').textContent='';
  try{const uid=user?await user.id():null;const id=$('#af-frente').value+'-'+Date.now().toString(36);
    await db.doc('restricciones/'+id).set({id,frente:$('#af-frente').value,texto:$('#af-texto').value.trim().slice(0,400),responsable:$('#af-resp').value.trim().slice(0,80),
      fecha:$('#af-fecha').value||null,estado:'Pendiente',origen:'Tablero',actualizado_por:uid,actualizado_en:new Date().toISOString()});
    $('#af-texto').value='';$('#af-resp').value='';$('#af-fecha').value='';$('#af-msg').textContent='Restricción agregada.'}
  catch(err){$('#af-msg').textContent='No se pudo agregar: tu acceso a este tablero es solo de lectura.'}
  btn.disabled=false});
window.addEventListener('hashchange',()=>{VIEW=(location.hash||'#general').slice(1);if(VIEW==='general')RFILTER='todos';render();window.scrollTo({top:0})});
if(window.TABLERO_DATA){EST=TABLERO_DATA.estado;RX=TABLERO_DATA.restricciones}
render();
(async()=>{
  if(!window.claude||!window.claude.use){return}
  db=await claude.use('db');user=await claude.use('user');
  if(!db){$('#view').textContent='';$('#view').append(el('div','card empty','Inicia sesión en Claude para ver los datos del tablero.'));return}
  try{canWrite=user?await user.can('data.write'):null}catch(e){canWrite=null}
  db.doc('tablero/estado').onSnapshot(s=>{EST=s.exists?s.data():null;render()},()=>{});
  db.collection('restricciones').onSnapshot(async q=>{RX=q.docs.map(d=>d.data());
    const ids=[...new Set(RX.map(r=>r.actualizado_por).filter(Boolean))];
    if(user&&ids.length){try{const ps=await user.profiles(ids);ids.forEach(i=>names[i]=(ps[i]&&ps[i].name)||'alguien')}catch(e){}}
    renderKpis();renderRx()},()=>{});
})();
})();
</script>
